name: Update profile art

# Atualiza o calendário e redesenha os cards todo dia.
# Também roda em push na main e quando alguém dispara o workflow à mão.

"on":
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Baixar contribuições
        run: python scripts/fetch_contributions.py

      - name: Desenhar os cards
        run: python scripts/render_cards.py

      - name: Gravar arte atualizada
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza os cards do perfil [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
